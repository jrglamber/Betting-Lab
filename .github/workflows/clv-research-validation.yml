name: CLV research validation
on:
  pull_request:
    paths:
      - 'clv_basketball_replay.py'
      - 'clv_hr2_shadow_research.py'
      - 'tests/test_clv_basketball_replay.py'
      - 'tests/test_clv_hr2_shadow_research.py'
      - 'scripts/audit_clv_basketball.py'
      - '.github/workflows/clv-research-validation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax validation
        run: python -m compileall -q clv_basketball_replay.py clv_hr2_shadow_research.py scripts/audit_clv_basketball.py
      - name: Unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_clv_basketball_replay.py tests/test_clv_hr2_shadow_research.py
