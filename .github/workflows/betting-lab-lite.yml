name: Betting Lab Lite safety regression
on:
  pull_request:
    paths:
      - 'betting_lab_lite_app.py'
      - 'tests/test_betting_lab_lite_app.py'
      - '.github/workflows/betting-lab-lite.yml'
  push:
    branches:
      - main
    paths:
      - 'betting_lab_lite_app.py'
      - 'tests/test_betting_lab_lite_app.py'
jobs:
  lite-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile betting_lab_lite_app.py
      - run: python -m unittest discover -s tests -p 'test_betting_lab_lite_app.py' -v
