name: HR portfolio shadow checks

on:
  pull_request:
    paths:
      - "hr_portfolio_shadow.py"
      - "hr_market_integrity.py"
      - "test_hr_market_integrity.py"
      - "hr_portfolio_queues.py"
      - "test_hr_portfolio_queues.py"
      - "hr_portfolio_telegram.py"
      - "telegram_alerts.py"
      - "test_hr_portfolio_telegram.py"
      - "hr_portfolio_presentation.py"
      - "test_hr_portfolio_presentation.py"
      - "oct25_research_priorities_patch.py"
      - "hit_rate_multiples_lab.py"
      - "hr_rolling_quality_challenger.py"
      - "test_hr_rolling_quality_challenger.py"
      - "test_hr_portfolio_shadow.py"
      - "test_hr_portfolio_postgres_links.py"
      - "production_dashboard_app.py"
      - ".github/workflows/hr-portfolio-shadow.yml"
  push:
    branches:
      - "research/hr-portfolio-ncaaf-forward-20261104"

permissions:
  contents: read

jobs:
  forward-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile hr_market_integrity.py test_hr_market_integrity.py hr_portfolio_queues.py test_hr_portfolio_queues.py hr_portfolio_shadow.py hr_portfolio_presentation.py hr_rolling_quality_challenger.py hr_portfolio_telegram.py telegram_alerts.py production_dashboard_app.py test_hr_portfolio_shadow.py test_hr_portfolio_postgres_links.py test_hr_rolling_quality_challenger.py test_hr_portfolio_presentation.py test_hr_portfolio_telegram.py
      - name: Forward-only shadow unit tests
        run: python -m pytest -q test_hr_market_integrity.py test_hr_portfolio_queues.py test_hr_portfolio_shadow.py test_hr_portfolio_postgres_links.py test_hr_rolling_quality_challenger.py test_hr_portfolio_presentation.py test_hr_portfolio_telegram.py
