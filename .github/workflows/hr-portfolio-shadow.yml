name: HR portfolio shadow checks

on:
  pull_request:
    paths:
      - "hr_portfolio_shadow.py"
      - "hr_market_integrity.py"
      - "test_hr_market_integrity.py"
      - "test_hr_market_conflict_abstention.py"
      - "hr_portfolio_queues.py"
      - "test_hr_portfolio_queues.py"
      - "hr_portfolio_telegram.py"
      - "hr2_telegram_only_patch.py"
      - "hr2_telegram_placement.py"
      - "test_hr2_telegram_placement.py"
      - "test_hr2_telegram_only.py"
      - "hit_rate_same_book_only_patch.py"
      - "telegram_alerts.py"
      - "test_hr_portfolio_telegram.py"
      - "hr_portfolio_presentation.py"
      - "test_hr_portfolio_presentation.py"
      - "oct25_research_priorities_patch.py"
      - "hit_rate_multiples_lab.py"
      - "hit_rate_jit_priority_patch.py"
      - "test_hr_weekend_quote_cap.py"
      - "test_hr2_ncaaf_promotion.py"
      - "hr2_singles_pocket_audit.py"
      - "test_hr2_singles_pocket_audit.py"
      - "hr_rolling_quality_challenger.py"
      - "test_hr_rolling_quality_challenger.py"
      - "test_hr_portfolio_shadow.py"
      - "test_hr_portfolio_postgres_links.py"
      - "production_dashboard_app.py"
      - "singles_vs_multiples_roi_audit.py"
      - "test_singles_vs_multiples_roi_audit.py"
      - "verified_jacquet_machac_rescue.py"
      - "verified_van_assche_tien_rescue.py"
      - "test_verified_van_assche_tien_rescue.py"
      - "tennis_result_retry_guard.py"
      - "test_tennis_result_retry_guard.py"
      - "tennis_result_pipeline_fix.py"
      - "test_tennis_hr_rich_cache_bridge.py"
      - "tennis_result_priority_budget_patch.py"
      - "test_tennis_result_priority_budget_patch.py"
      - "test_verified_jacquet_machac_rescue.py"
      - ".github/workflows/hr-portfolio-shadow.yml"
  push:
    branches:
      - "research/hr-portfolio-ncaaf-forward-20261104"

permissions:
  contents: read

jobs:
  forward-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile hr_market_integrity.py test_hr_market_integrity.py test_hr_market_conflict_abstention.py hr_portfolio_queues.py test_hr_portfolio_queues.py hr_portfolio_shadow.py hr_portfolio_presentation.py hr_rolling_quality_challenger.py hr_portfolio_telegram.py hr2_telegram_only_patch.py test_hr2_telegram_only.py hr2_telegram_placement.py test_hr2_telegram_placement.py hit_rate_same_book_only_patch.py hit_rate_jit_priority_patch.py test_hr_weekend_quote_cap.py telegram_alerts.py production_dashboard_app.py singles_vs_multiples_roi_audit.py test_singles_vs_multiples_roi_audit.py verified_jacquet_machac_rescue.py test_verified_jacquet_machac_rescue.py verified_van_assche_tien_rescue.py test_verified_van_assche_tien_rescue.py tennis_result_retry_guard.py test_tennis_result_retry_guard.py tennis_result_pipeline_fix.py test_tennis_hr_rich_cache_bridge.py tennis_result_priority_budget_patch.py test_tennis_result_priority_budget_patch.py test_hr_portfolio_shadow.py test_hr_portfolio_postgres_links.py test_hr2_ncaaf_promotion.py test_hr2_singles_pocket_audit.py hr2_singles_pocket_audit.py test_hr_rolling_quality_challenger.py test_hr_portfolio_presentation.py test_hr_portfolio_telegram.py
      - name: Forward-only shadow unit tests
        run: python -m pytest -q test_hr_market_conflict_abstention.py test_hr_market_integrity.py test_hr_portfolio_queues.py test_hr_portfolio_shadow.py test_hr_portfolio_postgres_links.py test_hr2_ncaaf_promotion.py test_hr2_singles_pocket_audit.py hr2_singles_pocket_audit.py test_hr_rolling_quality_challenger.py test_hr_portfolio_presentation.py test_hr_portfolio_telegram.py test_hr2_telegram_only.py test_hr2_telegram_placement.py test_hr_weekend_quote_cap.py test_verified_jacquet_machac_rescue.py test_singles_vs_multiples_roi_audit.py test_verified_van_assche_tien_rescue.py test_tennis_result_retry_guard.py test_tennis_hr_rich_cache_bridge.py test_tennis_result_priority_budget_patch.py
